name: kaascan
description: A new Flutter project.
publish_to: none
version: 1.0.0+19
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  splasher: ^0.1.1
  super_animated_navigation_bar: ^1.0.2
  smooth_sheets: ^0.14.0
  modal_bottom_sheet: ^3.0.0
  wheel_slider: ^1.2.2
  all_vibrate: ^0.0.2
  showcaseview: ^4.0.1
  flutter_portal: ^1.1.4
  sleek_circular_slider: ^2.1.0
  skeletonizer: ^2.1.0+1
  pinput: ^5.0.1
  flutter_advanced_avatar: ^1.5.2
  pretty_qr_code: ^3.5.0
  scanning_effect: ^1.0.11
  ai_barcode_scanner: ^7.0.0
  payment_card: ^0.0.1
  phone_form_field: ^10.0.8
  dio: ^5.5.0+1
  loader_overlay: ^5.0.0
  device_info_plus: ^11.5.0
  shared_preferences: ^2.5.3
  pool: ^1.5.1
  circular_seek_bar: ^1.1.1
  loading_animation_widget: ^1.3.0
  awesome_snackbar_content: ^0.1.7
  web_socket: ^1.0.1
  flutter_background: ^1.3.0+1
  web_socket_channel: ^3.0.3
  fluttertoast: ^8.2.12
  connectivity_plus: ^6.1.5
  flutter_secure_storage: ^9.2.4
  flutter_overlay_loader: ^2.0.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  firebase_messaging: ^16.0.0
  firebase_in_app_messaging: ^0.9.0
  change_app_package_name: ^1.5.0
  google_api_availability: ^5.0.1
  url_launcher: ^6.3.2
  get: ^4.7.2
  flutter_html: ^3.0.0
  flutter_svg: ^2.2.0
  provider: ^6.1.5
  collection: ^1.19.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  icons_launcher: ^3.0.1
icons_launcher:
  image_path: assets/icon.png
  platforms:
    android:
      enable: true
      image_path: assets/icon.png
      notification_image: assets/icon.png
      adaptive_background_image: assets/icon.png
      adaptive_foreground_image: assets/icon.png
      adaptive_round_image: assets/icon.png
      adaptive_monochrome_image: assets/icon.png
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/




