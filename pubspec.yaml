dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  icons_launcher: ^3.0.1
icons_launcher:
  image_path: assets/icon.png
  platforms:
    android:
      enable: true
      image_path: assets/icon.png
      notification_image: assets/icon.png
      adaptive_background_image: assets/icon.png
      adaptive_foreground_image: assets/icon.png
      adaptive_round_image: assets/icon.png
      adaptive_monochrome_image: assets/icon.png
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/animations/
    - assets/sound/
    - assets/pin_guide.png
   




